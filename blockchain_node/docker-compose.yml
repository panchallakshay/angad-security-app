services:
  blockchain-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angad-blockchain-node
    restart: unless-stopped
    ports:
      - "${NODE_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - CHAIN_FILE=/app/data/chain.json
    volumes:
      # Persistent storage for blockchain ledger
      - blockchain_data:/app/data
      # Or uncomment to mount directly to a local directory:
      # - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  blockchain_data:
    driver: local
